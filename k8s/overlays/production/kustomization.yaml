apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: odoo-prod

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

replicas:
  - name: odoo
    count: 3

images:
  - name: harbor.example.com/odoo/odoo
    newTag: v19.0.1  # Use specific version tags in production

patchesStrategicMerge:
  - production-patches.yaml
