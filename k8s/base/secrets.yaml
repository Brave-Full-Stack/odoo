apiVersion: v1
kind: Secret
metadata:
  name: odoo-secrets
  namespace: odoo
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_PASSWORD: "changeme_postgres_password"
  DB_PASSWORD: "changeme_postgres_password"
  # Odoo Admin Password
  ODOO_ADMIN_PASSWORD: "changeme_admin_password"
  # pgAdmin Credentials
  PGADMIN_DEFAULT_EMAIL: "admin@example.com"
  PGADMIN_DEFAULT_PASSWORD: "changeme_pgadmin_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry
  namespace: odoo
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config.json for Harbor registry
  # Generate with: kubectl create secret docker-registry harbor-registry \
  #   --docker-server=harbor.example.com \
  #   --docker-username=robot$odoo \
  #   --docker-password=<token> \
  #   --dry-run=client -o yaml
  .dockerconfigjson: e30K
