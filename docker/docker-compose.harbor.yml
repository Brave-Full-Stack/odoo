# Docker Compose for deploying from Harbor Registry
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: odoo-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: ${HARBOR_REGISTRY:-harbor.yourdomain.com}/odoo/odoo:${ODOO_VERSION:-19.0}
    container_name: odoo-app-prod
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      - HOST=postgres
      - USER=${POSTGRES_USER:-odoo}
      - PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - odoo-logs:/var/log/odoo
    networks:
      - odoo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  odoo-web-data:
    driver: local
  postgres-data:
    driver: local
  odoo-logs:
    driver: local

networks:
  odoo-network:
    driver: bridge
