[options]
# Database settings
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

# Odoo settings
addons_path = /opt/odoo/addons
data_dir = /var/lib/odoo
logfile = /var/log/odoo/odoo.log
log_level = info

# HTTP settings
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

# Performance
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Security
admin_passwd = admin
list_db = True
db_filter = .*

# Email
smtp_server = localhost
smtp_port = 25
smtp_ssl = False
smtp_user = False
smtp_password = False
