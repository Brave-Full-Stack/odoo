trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - docs/*
      - '**/*.md'

pr:
  branches:
    include:
      - main
      - develop

variables:
  - group: odoo-secrets
  - name: harborRegistry
    value: 'harbor.example.com'
  - name: harborProject
    value: 'odoo'
  - name: imageName
    value: 'odoo'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildImage
        displayName: 'Build Docker Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to Harbor'
            inputs:
              command: 'login'
              containerRegistry: 'harbor-connection'

          - task: Docker@2
            displayName: 'Build and Push Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(harborProject)/$(imageName)'
              dockerfile: '$(dockerfilePath)'
              containerRegistry: 'harbor-connection'
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)-latest
                latest

          - task: AzureCLI@2
            displayName: 'Scan Image with Trivy'
            inputs:
              azureSubscription: 'azure-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Install Trivy
                wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
                echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
                sudo apt-get update
                sudo apt-get install trivy -y
                
                # Scan image
                trivy image $(harborRegistry)/$(harborProject)/$(imageName):$(Build.BuildId)

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Dev Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'odoo-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: Kubernetes@1
                  displayName: 'Deploy to Kubernetes'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'k8s-dev-connection'
                    command: 'apply'
                    useConfigurationFile: true
                    configuration: '$(Build.SourcesDirectory)/k8s/overlays/dev'
                    
                - task: Kubernetes@1
                  displayName: 'Check Rollout Status'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'k8s-dev-connection'
                    command: 'rollout'
                    arguments: 'status deployment/dev-odoo -n odoo-dev'

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Production Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'odoo-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: Kubernetes@1
                  displayName: 'Create Database Backup'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'k8s-prod-connection'
                    command: 'exec'
                    arguments: '-n odoo-prod deployment/prod-postgres -- pg_dump -U odoo postgres > backup.sql'
                
                - task: Kubernetes@1
                  displayName: 'Deploy to Kubernetes'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'k8s-prod-connection'
                    command: 'apply'
                    useConfigurationFile: true
                    configuration: '$(Build.SourcesDirectory)/k8s/overlays/production'
                
                - task: Kubernetes@1
                  displayName: 'Wait for Rollout'
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceEndpoint: 'k8s-prod-connection'
                    command: 'rollout'
                    arguments: 'status deployment/prod-odoo -n odoo-prod --timeout=15m'
