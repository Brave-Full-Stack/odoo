version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: odoo-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # Using 5433 to avoid conflict with local PostgreSQL
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odoo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - odoo-network
    restart: unless-stopped
    depends_on:
      - postgres

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8070:8069"  # Using 8070 to avoid conflict with local Odoo
      - "8073:8071"
      - "8074:8072"
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      - ODOO_ADMIN_PASSWORD=admin
    volumes:
      - odoo-web-data:/var/lib/odoo
      - odoo-logs:/var/log/odoo
      - ./addons:/opt/odoo/addons
    networks:
      - odoo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  odoo-web-data:
    driver: local
  odoo-db-data:
    driver: local
  odoo-logs:
    driver: local
  pgadmin-data:
    driver: local

networks:
  odoo-network:
    driver: bridge
